name: Build and Draft Release

on:
  push:
    branches:
      - main

jobs:
  build-and-draft-release:
    name: Build & Create Draft Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev python3 python3-pil

      - name: Build Application
        run: |
          make clean
          make

      - name: Run Test Suite
        run: |
          make test

      - name: Package Release Bundle
        run: |
          mkdir -p release_dist
          cp cpe release_dist/
          cp cpe.desktop release_dist/
          cp cpe.png release_dist/
          cp README.md release_dist/
          tar -czvf cpe-linux-amd64.tar.gz -C release_dist .

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG_NAME="draft-${SHORT_SHA}"

          # Delete existing release with same tag if re-run
          gh release delete "${TAG_NAME}" --cleanup-tag --yes 2>/dev/null || true

          gh release create "${TAG_NAME}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "ComfyPromptExtractor Draft Release (${SHORT_SHA})" \
            --notes "Automated draft build of **ComfyPromptExtractor (CPE)** generated from commit \`${{ github.sha }}\` on \`main\`." \
            cpe \
            cpe-linux-amd64.tar.gz
